<title>Virtual Universe Worlds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Saira:wght@400;500;600&display=swap">
<style>
/* Layout: full-screen walkable world; HUD at the edges (world card + travel top-left, hints bottom-right, touch controls bottom). Single dark HUD look by design. */
:root {
  --ink: #05060d;
  --panel: rgba(9, 12, 26, 0.78);
  --line: rgba(140, 190, 255, 0.2);
  --text: #eef2fd;
  --muted: #9aa6c6;
  --accent: #5fb7ff;
  --gold: #ffcf6a;
  --display: "Chakra Petch", "Trebuchet MS", sans-serif;
  --body: "Saira", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--ink); color: var(--text); font-family: var(--body); touch-action: none; user-select: none; -webkit-user-select: none; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; backdrop-filter: blur(6px); }
#hud { position: fixed; inset: 0; pointer-events: none; }
#left { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: calc(14px + env(safe-area-inset-left, 0px)); width: min(310px, calc(100% - 28px)); display: grid; gap: 10px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: .16em; color: var(--accent); }
#card { padding: 12px 14px; display: grid; gap: 4px; }
#card h1 { margin: 0; font-family: var(--display); font-size: 24px; line-height: 1.05; }
#card .type { font-family: var(--display); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
#card .acts { font-size: 13px; color: var(--muted); }
#card .status { font-size: 12.5px; color: var(--gold); min-height: 1.2em; }
.controls { padding: 10px 12px; display: grid; gap: 8px; pointer-events: auto; }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.label { font-family: var(--display); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
select { background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; flex: 1; min-width: 0; }
select option { background: #0b0e1e; }
.seg { display: flex; gap: 3px; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 6px; padding: 2px; }
.seg button { background: none; border: 0; border-radius: 4px; padding: 5px 10px; font-family: var(--display); font-weight: 700; font-size: 12.5px; color: var(--muted); }
.seg button.on { background: rgba(95,183,255,.18); color: var(--text); }
a.btn { display: inline-block; text-decoration: none; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-family: var(--display); font-weight: 700; font-size: 12.5px; color: var(--text); }
a.btn:hover { border-color: var(--accent); }
#prompt { position: absolute; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 7px 14px; font-family: var(--display); font-size: 14px; white-space: nowrap; }
#prompt b { color: var(--gold); }
#hint { text-shadow: 0 1px 3px rgba(0,0,0,.9); position: absolute; right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); font-size: 12px; color: var(--muted); text-align: right; line-height: 1.7; }
#hint kbd { font-family: var(--display); font-size: 11px; border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; background: rgba(255,255,255,.06); }
#weaving { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); font-family: var(--display); font-size: 13px; letter-spacing: .3em; color: var(--accent); text-transform: uppercase; text-shadow: 0 0 12px rgba(95,183,255,.8); }
#loading { position: fixed; inset: 0; display: grid; place-items: center; font-family: var(--display); letter-spacing: .1em; color: var(--muted); text-align: center; padding: 16px; }
#touch { position: fixed; inset: 0; pointer-events: none; }
#joyzone { position: absolute; left: 0; bottom: 0; width: 45%; height: 55%; pointer-events: auto; }
#joy { position: absolute; width: 120px; height: 120px; margin: -60px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); background: rgba(10,14,30,.3); display: none; }
#joy i { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px; border-radius: 50%; background: rgba(255,255,255,.35); }
.tbtns { position: absolute; right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(2, 66px); gap: 10px; pointer-events: auto; }
.tb { width: 66px; height: 66px; border-radius: 50%; border: 1px solid var(--line); background: rgba(9,12,26,.7); font-family: var(--display); font-weight: 700; font-size: 12px; }
.tb.down { background: rgba(95,183,255,.45); }
body.touch #hint { display: none; }
@media (max-width: 720px) {
  #left { width: min(260px, calc(100% - 28px)); }
  #card h1 { font-size: 19px; }
  #card .acts { display: none; }
  #prompt { bottom: calc(110px + env(safe-area-inset-bottom, 0px)); font-size: 13px; }
}
</style>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

const ATOMS = isTouch ? 26000 : 70000;

/* ---------- the worlds ---------- */
// crop: the part of your master map each world takes its colours from (same crops as Universe Flight)
const DEFS = [
  { id: 'core', name: 'The Core', type: 'Central hub', acts: 'Social · Commerce · Quests · Travel · Customisation', crop: [0.501, 0.371, 0.075],
    sky: ['#070b24', '#2c2a66', '#7a4f9a'], fog: ['#231e4a', 70, 330], sun: ['#d8e4ff', 1.5, 55], ground: ['#1a1d2c', '#262b40'], amp: 0, particles: 'sparks' },
  { id: 'orbital', name: 'Orbital Station', type: 'Space station', acts: 'Dock · Upgrade · Prepare for your next journey', crop: [0.484, 0.066, 0.042],

    sky: ['#3d6aa8', '#e8b07a', '#ffd9a0'], fog: ['#e2b989', 80, 400], sun: ['#ffd6a0', 2.4, 22], ground: ['#c49a62', '#d8b07a'], amp: 7, dunes: true, particles: 'dust' },

  { id: 'astra', name: 'Astra', type: 'Space exploration', acts: 'Planets · Resources · Research · Build · Discover', crop: [0.602, 0.707, 0.06],

  { id: 'oblivion', name: 'Oblivion', type: 'Dark realm', acts: 'Combat · PvP · Dungeons · High risk, high reward', crop: [0.176, 0.586, 0.06],
    sky: ['#080406', '#2a0c0c', '#7a2010'], fog: ['#2a0e0a', 40, 260], sun: ['#ff9a6a', 1.1, 15], ground: ['#1c1514', '#2a1d1a'], amp: 10, particles: 'embers' },
  { id: 'zephyr', name: 'Zephyr', type: 'Natural world', acts: 'Survival · Wildlife · Crafting · Rare eco zones', crop: [0.195, 0.469, 0.04],
    sky: ['#2c5a5a', '#8ab890', '#e0e8b0'], fog: ['#7aa07a', 40, 260], sun: ['#f0f0c0', 1.7, 45], ground: ['#2c4a22', '#3e6a2c'], amp: 8, particles: 'fireflies' }
];
const byId = Object.fromEntries(DEFS.map(d => [d.id, d]));

/* ---------- renderer ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: !isTouch, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, isTouch ? 1.3 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.9;

$('#stage').appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 4000);
const hemi = new THREE.HemisphereLight(0xffffff, 0x404040, 0.6); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2); sun.castShadow = !isTouch; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, near: 1, far: 400 }); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
const sunDir = new THREE.Vector3();

const sky = new THREE.Mesh(new THREE.SphereGeometry(1800, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color() }, mid: { value: new THREE.Color() }, bot: { value: new THREE.Color() } },
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'uniform vec3 top, mid, bot; varying vec3 vP; void main(){ float h = vP.y; vec3 c = h > 0.0 ? mix(bot, mid, smoothstep(0.0, 0.18, h)) : bot; c = h > 0.18 ? mix(mid, top, smoothstep(0.18, 0.75, h)) : c; gl_FragColor = vec4(c, 1.0); }'
}));
scene.add(sky);
const stars = (() => {
  const n = 3000, p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const u = Math.random() * TAU, v = Math.acos(rand(-0.2, 1)), r = 1600; p.set([Math.sin(v) * Math.cos(u) * r, Math.cos(v) * r, Math.sin(v) * Math.sin(u) * r], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  const s = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xdde6ff, size: 1.5, sizeAttenuation: false, fog: false, transparent: true, depthWrite: false })); scene.add(s); return s;
})();

/* ---------- small helpers ---------- */
function hash(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
function noise(x, z) { const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi, u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf); return lerp(lerp(hash(xi, zi), hash(xi + 1, zi), u), lerp(hash(xi, zi + 1), hash(xi + 1, zi + 1), u), v); }
function fbm(x, z) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < 4; i++) { s += a * noise(x * f, z * f); f *= 2; a *= 0.5; } return s; }
function canvasTex(draw, size, rep = 1, srgb = true) { const c = document.createElement('canvas'); c.width = c.height = size; draw(c.getContext('2d'), size); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); if (srgb) t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t; }
function textSprite(text, color, w = 8) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128; const g = c.getContext('2d');
  g.font = '700 58px "Chakra Petch", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.shadowColor = 'rgba(0,0,0,.9)'; g.shadowBlur = 10; g.fillStyle = color; g.fillText(text, 256, 66);

const softGlow = canvasTex((g, S) => { const gr = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.4, 'rgba(255,255,255,.35)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, S, S); }, 64);

/* ---------- palettes from your art ---------- */
let mapImg = null;
function paletteFor(def) {
  if (!mapImg) return null;
  const N = 48, c = document.createElement('canvas'); c.width = c.height = N; const g = c.getContext('2d');
  const r = def.crop[2] * mapImg.width; g.drawImage(mapImg, def.crop[0] * mapImg.width - r, def.crop[1] * mapImg.height - r, 2 * r, 2 * r, 0, 0, N, N);

  const vivid = cols.filter(c => c.l > 0.35 && c.l < 0.8).sort((a, b) => b.s - a.s);

  return { dark: lin(at(0.12)), mid: lin(at(0.5)), bright: lin(at(0.88)), accent: lin((vivid[0] || cols[cols.length - 1]).col.clone()), accent2: lin((vivid[Math.floor(vivid.length * 0.25)] || cols[0]).col.clone()) };
}

/* ---------- world state ---------- */
let world = null;
const boxes = [], posts = [];
function solidBox(x, z, w, d, h, y0 = -50) { boxes.push({ x0: x - w / 2, x1: x + w / 2, z0: z - d / 2, z1: z + d / 2, h, y0 }); }

  for (const c of posts) if (c.r > 1.2 && Math.hypot(x - c.x, z - c.z) < c.r && c.h <= y + 0.6 && c.h > top) top = c.h;

/* builders add meshes through these, so every solid thing is also a collider and an atom source */
let G = null, PAL = null;
const std = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.75, metalness: 0.05 }, o));
const glowMat = color => new THREE.MeshBasicMaterial({ color });
function add(geo, mat, x, y, z, o = {}) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  if (o.ry) m.rotation.y = o.ry; if (o.rx) m.rotation.x = o.rx; if (o.rz) m.rotation.z = o.rz;
  m.castShadow = o.shadow !== false; m.receiveShadow = true; G.add(m); if (o.atoms !== false) world.meshes.push(m); return m;
}
function groundY(x, z) { return world.h(x, z); }
function box(x, z, w, h, d, mat, o = {}) { const y = (o.y ?? groundY(x, z)); const m = add(new THREE.BoxGeometry(w, h, d), mat, x, y + h / 2, z, o); if (o.solid !== false) solidBox(x, z, o.ry ? Math.max(w, d) : w, o.ry ? Math.max(w, d) : d, y + h, y - 1); return m; }

  const floor = standHeight(player.pos.x, player.pos.z, player.pos.y);
  if (player.pos.y <= floor + 0.02 && player.vy <= 0) { player.pos.y = floor; player.vy = 0; player.grounded = true; } else player.grounded = false;
  // walking downhill: stay glued to gentle slopes instead of floating
  if (!player.grounded && player.vy <= 0 && player.pos.y - floor < 0.6 && !(keys.Space || touchJump)) { player.pos.y = floor; player.vy = 0; player.grounded = true; }
  const hs = Math.hypot(player.vel.x, player.vel.z);
  if (len > 0.05) player.face += angDiff(player.face, Math.atan2(dir.x, dir.z)) * Math.min(1, 12 * dt);
  if (player.grounded) setAnim(hs < 0.5 ? 'idle' : hs < 3.6 ? 'walk' : 'run');
  if (avatar.state === 'walk') avatar.actions.walk.timeScale = clamp(hs / 1.9, 0.6, 1.6);
  if (avatar.state === 'run') avatar.actions.run.timeScale = clamp(hs / 5.5, 0.75, 1.6);
  avatar.g.position.copy(player.pos); avatar.g.rotation.y = player.face; avatar.mixer.update(dt);
  // gates, boost pads, lava, motion
  gateCooldown -= dt;
  let promptMsg = '';
  for (const gt of world.gates) {
    gt.fill.material.opacity = 0.4 + Math.sin(time * 3) * 0.15;
    const d = Math.hypot(player.pos.x - gt.pos.x, player.pos.z - gt.pos.z);
    if (d < 9) promptMsg = `Walk through to travel to <b>${gt.target.name}</b>`;
    if (d < 1.6 && gateCooldown < 0 && world.woven) { loadWorld(gt.target.id); return; }
  }
  for (const pd of world.pads) if (Math.hypot(player.pos.x - pd.x, player.pos.z - pd.z) < 3) { player.boostT = 1.2; promptMsg = 'Boost!'; }
  for (const lv of world.lava) lv.material.color.setHSL(0.04 + Math.sin(time * 2) * 0.01, 1, 0.5 + Math.sin(time * 3 + lv.position.x) * 0.06);
  for (const s of world.spin) s.rotation.y += dt * 0.4;
  for (const b of world.bob) b.m.position.y = b.y + Math.sin(time * 0.6 + b.p) * 1.5;
  const pr = $('#prompt'); if (pr.dataset.msg !== promptMsg) { pr.dataset.msg = promptMsg; pr.innerHTML = promptMsg; pr.hidden = !promptMsg; }
  updateParticles(dt, time);
  // camera: behind the player, kept out of walls and above the ground
  camTarget.set(player.pos.x, player.pos.y + 1.6, player.pos.z);
  back.set(-Math.sin(cam.yaw) * Math.cos(cam.pitch), Math.sin(cam.pitch), -Math.cos(cam.yaw) * Math.cos(cam.pitch));
  const want = 5.2, free = rayToBoxes(camTarget, back, want), dist = free < want ? Math.max(0.3, free - 0.3) : want;
  camera.position.copy(camTarget).addScaledVector(back, dist);
  const gyCam = world.h(camera.position.x, camera.position.z) + 0.4; if (camera.position.y < gyCam) camera.position.y = gyCam;
  camera.lookAt(camTarget); avatar.g.visible = dist > 0.8;
  sky.position.copy(camera.position); stars.position.copy(camera.position);
  sun.position.copy(player.pos).addScaledVector(sunDir, 200); sun.target.position.copy(player.pos);
  renderer.render(scene, camera);
}

/* ---------- start ---------- */
atomMat.uniforms.uScale.value = innerHeight * renderer.getPixelRatio() / 2 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
const img = new Image();
const mapReady = new Promise(res => { img.onload = () => { mapImg = img; res(); }; img.onerror = () => res(); img.src = 'world/universe-map-2.jpg'; });
Promise.all([mapReady, loadModels()]).then(() => {
  buildAvatar();
  const hash = location.hash.replace('#', '');
  loadWorld(byId[hash] ? hash : 'core');
  $('#loading').hidden = true; $('#hud').hidden = false; $('#touch').hidden = !isTouch;
}).catch(err => { console.error(err); $('#loading').textContent = 'The worlds could not load. Reload to try again.'; });
window.__vu = { player, boxes, posts, get world() { return world.def.id; } }; // read by the headless tests
requestAnimationFrame(t => { last = t; frame(t); });
})();
