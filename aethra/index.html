<title>Aethra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Saira:wght@400;500;600&display=swap">
<style>
/* Layout: full-screen WebGL city with a HUD frame around the edges; panels float over a dimmed game. Single dark neon look by design. */
:root {
  --ink: #0a0b18;
  --panel: rgba(13, 14, 32, 0.9);
  --line: rgba(170, 160, 255, 0.2);
  --text: #eeedfb;
  --muted: #a3a0c9;
  --accent: #3ee6d2;
  --hot: #ff4f8b;
  --gold: #ffcf5a;
  --hp: #ff5b6e;
  --en: #5aa8ff;
  --display: "Chakra Petch", "Trebuchet MS", sans-serif;
  --body: "Saira", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--ink); color: var(--text); font-family: var(--body); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* HUD */
#hud { position: fixed; inset: 0; pointer-events: none; }
.hud-tl { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px)); display: grid; gap: 6px; width: min(260px, 46vw); }
.who { display: flex; align-items: center; gap: 10px; }
.lvl { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .06em; background: var(--accent); color: var(--ink); padding: 2px 8px; border-radius: 3px; }
.pname { font-family: var(--display); font-weight: 700; font-size: 16px; text-shadow: 0 1px 3px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 8px; background: rgba(0,0,0,.55); border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 50%; transition: width .15s; }
.bar.hp > i { background: var(--hp); }
.bar.en > i { background: var(--en); }
.bar.xp { height: 4px; }
.bar.xp > i { background: var(--accent); }
.hud-tr { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); display: grid; justify-items: end; gap: 8px; }
.wallet { font-family: var(--display); font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 6px; text-shadow: 0 1px 3px #000; font-variant-numeric: tabular-nums; }
.wallet svg { width: 16px; height: 16px; color: var(--accent); }
#minimap { width: 150px; height: 150px; border-radius: 50%; border: 2px solid var(--line); background: rgba(8,9,22,.8); }
.hud-btns { display: flex; gap: 6px; pointer-events: auto; }
.hbtn { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 5px 9px; font-family: var(--display); font-size: 12px; letter-spacing: .05em; }
.hbtn:hover { border-color: var(--accent); }

#elements { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; pointer-events: auto; }
.el { position: relative; width: 52px; height: 52px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; padding: 0; overflow: hidden; }
.el svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.el .k { position: absolute; top: 2px; left: 4px; font-size: 10px; color: var(--muted); font-family: var(--display); }
.el .r { position: absolute; bottom: 1px; right: 4px; font-size: 10px; color: var(--muted); font-family: var(--display); }
.el.sel { border-color: currentColor; box-shadow: 0 0 0 1px currentColor, 0 0 16px -2px currentColor; }
.el.locked { opacity: .45; }
.el.locked svg { display: none; }
.el .lock { display: none; font-family: var(--display); font-size: 11px; color: var(--muted); }
.el.locked .lock { display: block; }
.el .cd { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.6); height: 0%; }

#prompt { position: absolute; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); padding: 6px 14px; border-radius: 4px; font-family: var(--display); font-size: 14px; white-space: nowrap; }
#prompt b { color: var(--gold); }
#target { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: min(240px, 40vw); text-align: center; font-family: var(--display); font-size: 12px; letter-spacing: .05em; display: grid; gap: 4px; }
#target .bar > i { background: var(--hot); }
#jobs { position: absolute; left: calc(12px + env(safe-area-inset-left, 0px)); top: calc(118px + env(safe-area-inset-top, 0px)); width: 220px; background: rgba(10,11,26,.6); border-left: 2px solid var(--accent); padding: 8px 10px; font-size: 12.5px; display: grid; gap: 4px; }
#jobs h4 { margin: 0 0 2px; font-family: var(--display); font-size: 11px; letter-spacing: .12em; color: var(--accent); text-transform: uppercase; }
#jobs .done { color: var(--muted); text-decoration: line-through; }
#jobs .n { color: var(--muted); font-variant-numeric: tabular-nums; }
#race { position: absolute; top: calc(70px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); text-align: center; font-family: var(--display); }
#race .pos { font-size: 44px; font-weight: 700; line-height: 1; text-shadow: 0 2px 8px #000; }
#race .pos small { font-size: 18px; color: var(--muted); }
#race .meta { font-size: 13px; color: var(--muted); letter-spacing: .05em; font-variant-numeric: tabular-nums; }
#count { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: min(28vw, 180px); color: var(--gold); text-shadow: 0 0 40px rgba(255,180,60,.6); }
#speedo { position: absolute; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); font-family: var(--display); font-weight: 700; font-size: 34px; text-align: right; line-height: 1; text-shadow: 0 2px 8px #000; font-variant-numeric: tabular-nums; }
#speedo small { display: block; font-size: 11px; letter-spacing: .15em; color: var(--muted); }
#hurt { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 120px 30px rgba(255,40,70,.75); opacity: 0; transition: opacity .3s; }
#cross { position: absolute; left: 50%; top: 45%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: rgba(255,255,255,.8); box-shadow: 0 0 0 2px rgba(0,0,0,.35); }

#toasts { position: fixed; top: calc(64px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: grid; gap: 6px; justify-items: center; pointer-events: none; width: min(460px, calc(100% - 32px)); }
.toast { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); padding: 8px 14px; border-radius: 4px; font-size: 14px; text-align: center; animation: tin .25s ease-out; }
.toast.gold { border-left-color: var(--gold); }
.toast.hot { border-left-color: var(--hot); }
@keyframes tin { from { transform: translateY(-8px); opacity: 0; } }

/* Panels */
#shade { position: fixed; inset: 0; background: rgba(6,6,16,.55); display: grid; place-items: center; padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.panel { width: min(520px, 100%); max-height: 86vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; display: grid; gap: 14px; backdrop-filter: blur(6px); }
.panel h2 { margin: 0; font-family: var(--display); font-size: 24px; letter-spacing: .03em; text-wrap: balance; }
.panel p { margin: 0; color: var(--muted); line-height: 1.5; }
.panel h3 { margin: 4px 0 0; font-family: var(--display); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: 9px 14px; font-family: var(--display); font-weight: 700; letter-spacing: .04em; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--ink); border-color: var(--accent); }
.btn.danger { border-color: var(--hot); color: var(--hot); }
.btn.on { border-color: var(--gold); color: var(--gold); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; font-family: var(--display); font-weight: 700; color: var(--muted); }
.tab.on { color: var(--text); border-color: var(--accent); }
.prow { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.prow svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.prow .t { font-weight: 600; }
.prow .s { font-size: 12.5px; color: var(--muted); }
.pips { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: middle; }
.pips i { width: 8px; height: 8px; border-radius: 1px; background: rgba(255,255,255,.15); }
.pips i.f { background: currentColor; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
.sw.on { border-color: var(--text); box-shadow: 0 0 0 2px var(--ink) inset; }
table.res { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.res td { padding: 6px 4px; border-bottom: 1px solid var(--line); }
table.res tr.me td { color: var(--gold); font-weight: 600; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13.5px; }
.keys kbd { font-family: var(--display); font-size: 12px; background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px; white-space: nowrap; }
.note { font-size: 12.5px; color: var(--muted); border-left: 2px solid var(--gold); padding-left: 10px; }

/* Creator */
#creator { box-sizing: border-box; position: fixed; top: 0; bottom: 0; left: 0; width: min(380px, 100%); padding: calc(18px + env(safe-area-inset-top, 0px)) 18px calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); background: linear-gradient(90deg, rgba(10,11,24,.92) 72%, rgba(10,11,24,.0)); overflow: auto; display: grid; gap: 14px; align-content: start; }
.brand { font-family: var(--display); font-weight: 700; font-size: 46px; letter-spacing: .18em; line-height: 1; background: linear-gradient(180deg, #fff 30%, var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tag { color: var(--muted); font-size: 14px; margin-top: -6px; }
.field { display: grid; gap: 6px; }
.field > label, .field > span { font-family: var(--display); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.field input[type=text], .field select { background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 5px; padding: 9px 10px; color: var(--text); font: inherit; }
.field input[type=color] { width: 44px; height: 32px; border: 1px solid var(--line); border-radius: 5px; background: none; padding: 2px; }
.field input[type=range] { width: 100%; accent-color: var(--accent); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.facebox { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.facebox img { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; border: 1px solid var(--line); }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* Touch controls */
#touch { position: fixed; inset: 0; pointer-events: none; }
#joyzone { position: absolute; left: 0; bottom: 0; width: 45%; height: 60%; pointer-events: auto; }
#joy { position: absolute; width: 120px; height: 120px; margin: -60px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); background: rgba(10,10,30,.25); display: none; }
#joy i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px; border-radius: 50%; background: rgba(255,255,255,.35); }
.tbtns { position: absolute; right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(2, 64px); gap: 10px; pointer-events: auto; }
.tb { width: 64px; height: 64px; border-radius: 50%; background: rgba(13,14,32,.7); border: 1px solid var(--line); font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: .05em; }
.tb.big { background: rgba(255,79,139,.35); border-color: var(--hot); }
.tb:active { background: rgba(62,230,210,.35); }
body.touch #cross, body.touch .keyhint { display: none; }
body.touch #elements { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
body.touch #speedo { bottom: auto; top: calc(200px + env(safe-area-inset-top, 0px)); }
body.touch #prompt { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }

@media (max-width: 720px) {
  #minimap { width: 110px; height: 110px; }
  #jobs { display: none; }
  .el { width: 44px; height: 44px; }
  #creator { top: auto; width: 100%; max-height: 58vh; background: rgba(10,11,24,.95); border-top: 1px solid var(--line); }
  .brand { font-size: 32px; }
  .hud-tl { width: 44vw; }
  #toasts { top: auto; bottom: calc(240px + env(safe-area-inset-bottom, 0px)); }
  .toast { font-size: 13px; padding: 6px 10px; }
}
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const TAU = Math.PI * 2;
const angDiff = (a, b) => ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('touch');

if (!window.THREE || !THREE.GLTFLoader || !THREE.Sky || !THREE.SkeletonUtils) {
  document.body.innerHTML = '<p style="padding:24px;font-family:sans-serif;color:#eee">The 3D engine could not load. Check your connection and reload.</p>';
  return;
}

/* ---------- data ---------- */
const ICONS = {
  fire: '<path d="M12 3c.5 3.5 5 5.5 5 10.5a5 5 0 0 1-10 0c0-2.6 1.4-3.9 2.2-5.6.5 1.4 1.3 2.1 2.3 2.4C11 8 11.2 5.5 12 3z"/>',
  air: '<path d="M3 8h10a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"/>',
  ice: '<path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7M9 4l3 2 3-2M9 20l3-2 3 2"/>',
  earth: '<path d="M2 20l7-12 4 6 3-4 6 10z"/>',
  bolt: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>'
};
const ELEMENTS = [
  { id: 'fire', name: 'Fireball', el: 'Fire', unlock: 1, cost: 14, cd: 0.4, color: 0xff6a2b, css: '#ff7a3d', desc: 'Fast projectile. Ranks add damage.' },
  { id: 'air', name: 'Gust Dash', el: 'Air', unlock: 2, cost: 20, cd: 1.2, color: 0xcdeeff, css: '#cdeeff', desc: 'Speed burst and high leap. In a car: nitro boost.' },
  { id: 'ice', name: 'Frost Nova', el: 'Ice', unlock: 3, cost: 28, cd: 3, color: 0x7fd8ff, css: '#7fd8ff', desc: 'Freezes enemies nearby. In a car: freezes rival cars.' },
  { id: 'earth', name: 'Quake', el: 'Earth', unlock: 4, cost: 34, cd: 4, color: 0xd0904d, css: '#d0904d', desc: 'Shockwave that hits and throws back everything around you.' },
  { id: 'bolt', name: 'Chain Bolt', el: 'Lightning', unlock: 5, cost: 30, cd: 2.4, color: 0xf7f36a, css: '#f7f36a', desc: 'Strikes the nearest enemy, then jumps to two more.' }
];
const CAR_COLORS = ['#a8132a', '#1d2d50', '#e9e9e6', '#141518', '#8c929a', '#2f5d3a', '#c4651b', '#2a6fb0'];
const ENGINES = [null, { name: 'Street', max: 42, price: 0 }, { name: 'Tuned', max: 50, price: 300 }, { name: 'Race', max: 58, price: 800 }];
const JOBS = [
  { id: 'drones5', text: 'Defeat 5 rogue drones', goal: 5, stat: 'drones', reward: 150 },
  { id: 'race1', text: 'Win a street race', goal: 1, stat: 'wins', reward: 200 },
  { id: 'upset', text: 'Defeat a drone above your level', goal: 1, stat: 'upsets', reward: 120 },
  { id: 'lvl5', text: 'Reach level 5', goal: 5, stat: 'level', reward: 250 }
];
const RIVALS = ['Vex', 'Kira-9', 'Duke Rami', 'Solene', 'Marlo', 'Juno Bright'];

const DEFAULT = { v: 1, name: '', body: 'woman', height: 1,
  level: 1, xp: 0, shards: 150, pp: 0, ranks: { fire: 1, air: 1, ice: 1, earth: 1, bolt: 1 }, carColor: '#a8132a', engine: 1,
  stats: { drones: 0, wins: 0, upsets: 0 }, jobs: {}, created: false };
const KEY = 'aethra-save-v1';
let save = structuredClone(DEFAULT);
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.v === 1) save = Object.assign(structuredClone(DEFAULT), s, { stats: Object.assign({}, DEFAULT.stats, s.stats), ranks: Object.assign({}, DEFAULT.ranks, s.ranks) }); } catch (e) {}
save.height = clamp(+save.height || 1, 0.92, 1.08); if (save.body !== 'man') save.body = 'woman';
function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }
const xpNeed = l => 60 + l * 60;
const maxHp = () => 100 + (save.level - 1) * 12;
const maxEn = () => 100 + (save.level - 1) * 8;

/* ---------- renderer ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: !isTouch, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, isTouch ? 1.25 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.5;
renderer.shadowMap.enabled = !isTouch;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('#stage').appendChild(renderer.domElement);
const scene = new THREE.Scene();

  for (const c of cars) if (!c.ai && c !== player.car) {
    if (c.traffic) driveTraffic(c, dt);
    else if (c.frozenT > 0 || Math.abs(c.speed) > 0.1) driveCar(c, 0, 0, true, dt);
  }
  updateRace(dt);
  carCollisions(); pushPlayerFromCars();
  if (player.car) player.pos.copy(player.car.pos);
  updatePeds(dt);

  const pTarget = chest();
  for (const d of drones) {
    if (d.deadT > 0) { d.deadT -= dt; if (d.deadT <= 0) resetDrone(d); continue; }
    d.bob += dt * 2;
    if (d.hitT > 0) { d.hitT -= dt; d.eyeMat.color.set(0xffffff); } else d.eyeMat.color.set(d.frozenT > 0 ? 0x7fd8ff : 0xff3d5a);
    if (d.kb.lengthSq() > 0.01) { d.pos.addScaledVector(d.kb, dt); d.kb.multiplyScalar(1 - 3 * dt); }
    if (d.frozenT > 0) { d.frozenT -= dt; d.g.position.copy(d.pos); continue; }
    const aggro = !player.car && !player.dead && hdist(d.pos, player.pos) < 46;
    const goal = aggro ? player.pos.clone().add(new THREE.Vector3(Math.sin(d.bob * 0.3) * 10, 0, Math.cos(d.bob * 0.3) * 10)) : d.home.clone().add(new THREE.Vector3(Math.sin(d.bob * 0.2) * 12, 0, Math.cos(d.bob * 0.25) * 12));
    goal.y = 5 + Math.sin(d.bob) * 0.8;
    d.pos.lerp(goal, Math.min(1, dt * (aggro ? 0.9 : 0.4)));
    d.pos.y = Math.max(2, d.pos.y);
    d.g.position.copy(d.pos); d.g.rotation.y += dt * 2;
    if (aggro) {
      d.shootT -= dt;
      if (d.shootT <= 0) {
        d.shootT = rand(1.8, 2.8) - Math.min(0.8, d.level * 0.05);
        const m = new THREE.Mesh(orbGeo, orbMat); m.position.copy(d.pos); scene.add(m);
        orbs.push({ m, vel: pTarget.clone().sub(d.pos).normalize().multiplyScalar(17 + d.level), life: 4, dmg: 5 + d.level * 2 });
      }
    }
  }
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i]; o.life -= dt; o.m.position.addScaledVector(o.vel, dt);
    let gone = o.life <= 0 || o.m.position.y < 0;
    if (!gone && !player.car && !player.dead && o.m.position.distanceTo(pTarget) < 1.1) { hurtPlayer(o.dmg); gone = true; }
    if (gone) { scene.remove(o.m); orbs.splice(i, 1); }
  }
  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i]; s.life -= dt; s.m.position.addScaledVector(s.vel, dt);
    let gone = s.life <= 0 || s.m.position.y < 0;
    if (!gone) for (const d of drones) if (d.deadT <= 0 && d.pos.distanceTo(s.m.position) < 1.5) { hurtDrone(d, s.dmg); burstFx(s.m.position, 0xff7a3d, 2.2, 0.3); gone = true; break; }
    if (!gone) { const p = s.m.position; for (const b of boxes) if (p.y < b.h && p.x > b.x0 && p.x < b.x1 && p.z > b.z0 && p.z < b.z1) { burstFx(p, 0xff7a3d, 1.6, 0.25); gone = true; break; } }
    if (gone) { scene.remove(s.m); shots.splice(i, 1); }
  }
  if (targetT > 0) targetT -= dt;
  updatePrompt();
}
function updateEffects(dt) {
  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i]; e.t += dt; e.upd(e, Math.min(1, e.t / e.life));
    if (e.t >= e.life) { scene.remove(e.obj); e.obj.geometry.dispose(); e.obj.material.dispose(); effects.splice(i, 1); }
  }
}
const camTarget = new THREE.Vector3();
function updateCamera(dt) {
  cam.lookT += dt;
  if (mode === 'creator') {
    if (!avatar) { camera.position.set(0, 3, 30); camera.lookAt(0, 2, 0); return; }
    const t = performance.now() / 1000, a = Math.sin(t * 0.35) * 0.5;
    const c = avatar.g.position.clone().add(new THREE.Vector3(0, 1.05 * save.height, 0));
    camera.position.set(c.x + Math.sin(a) * 3.8, c.y + 0.35, c.z + Math.cos(a) * 3.8);
    camera.lookAt(c);
    const r = new THREE.Vector3(); camera.getWorldDirection(r); r.cross(camera.up).normalize();
    camera.lookAt(innerWidth <= 720 ? c.clone().add(new THREE.Vector3(0, -0.8, 0)) : c.clone().addScaledVector(r, -1.0));
    avatar.g.rotation.y = Math.sin(t * 0.6) * 0.25;
    return;
  }
  const inCar = !!player.car;
  const dist = inCar ? 8.5 : cam.dist, h = inCar ? 1.9 : 1.6 * save.height;
  camTarget.set(player.pos.x, player.pos.y + h, player.pos.z);
  const p = inCar ? clamp(cam.pitch, 0.12, 0.6) : cam.pitch;
  const fx = Math.sin(cam.yaw), fz = Math.cos(cam.yaw);
  camera.position.set(camTarget.x - fx * dist * Math.cos(p), camTarget.y + dist * Math.sin(p), camTarget.z - fz * dist * Math.cos(p));
  if (camera.position.y < 0.6) camera.position.y = 0.6;
  if (cam.shake > 0) { cam.shake -= dt; camera.position.x += rand(-0.3, 0.3); camera.position.y += rand(-0.3, 0.3); }
  camera.lookAt(camTarget);
  const fov = inCar ? 60 + clamp(Math.abs(player.car.speed) / 3, 0, 14) : 60;
  if (Math.abs(camera.fov - fov) > 0.1) { camera.fov = lerp(camera.fov, fov, Math.min(1, 4 * dt)); camera.updateProjectionMatrix(); }
}

/* ---------- HUD ---------- */
const txt = {};
function setText(id, v) { if (txt[id] !== v) { txt[id] = v; document.getElementById(id).textContent = v; } }
function setW(id, f) { const v = (clamp(f, 0, 1) * 100).toFixed(1) + '%'; if (txt[id] !== v) { txt[id] = v; document.getElementById(id).style.width = v; } }
function updateHUD() {
  if (mode !== 'play') return;
  setText('lvl', 'LV ' + save.level); setText('pname', save.name);
  setW('xpbar', save.xp / xpNeed(save.level)); setW('hpbar', player.hp / maxHp()); setW('enbar', player.en / maxEn());
  setText('shards', save.shards.toLocaleString());
  const showT = targetT > 0 && target && target.deadT <= 0;
  if ($('#target').hidden === showT) $('#target').hidden = !showT;
  if (showT) { setText('tname', `Rogue drone · Lv ${target.level}`); setW('tbar', target.hp / target.maxHp); }
  const inCar = !!player.car;
  if ($('#speedo').hidden === inCar) $('#speedo').hidden = !inCar;
  if (inCar) setText('kmh', String(Math.round(Math.abs(player.car.speed) * 3.6)));
  ELEMENTS.forEach((e, i) => { const el = elNodes[i]; if (!el) return; el.cd.style.height = (cds[e.id] / e.cd * 100).toFixed(0) + '%'; });
}
const elNodes = [];
function renderElements() {
  const box = $('#elements'); box.innerHTML = ''; elNodes.length = 0;
  ELEMENTS.forEach((e, i) => {
    const b = document.createElement('button');
    const locked = save.level < e.unlock;
    b.className = 'el' + (i === sel ? ' sel' : '') + (locked ? ' locked' : '');
    b.style.color = e.css; b.title = `${e.el}: ${e.name}` + (locked ? ` (unlocks at level ${e.unlock})` : '');
    b.setAttribute('aria-label', b.title);
    b.innerHTML = `<span class="k">${i + 1}</span><svg viewBox="0 0 24 24">${ICONS[e.id]}</svg><span class="lock">LV${e.unlock}</span>${locked ? '' : `<span class="r">${save.ranks[e.id]}</span>`}<span class="cd"></span>`;
    b.addEventListener('pointerdown', ev => { ev.stopPropagation(); selectEl(i); });
    box.appendChild(b); elNodes.push({ cd: b.querySelector('.cd') });
  });
}
function renderJobs() {
  $('#jobs').innerHTML = '<h4>Jobs</h4>' + JOBS.map(j => {
    const v = j.stat === 'level' ? save.level : save.stats[j.stat] || 0, done = save.jobs[j.id];
    return `<div class="${done ? 'done' : ''}">${esc(j.text)} <span class="n">${done ? 'done' : Math.min(v, j.goal) + '/' + j.goal}</span></div>`;
  }).join('');
}
function updatePrompt() {
  let msg = '';
  const tap = isTouch;
  const near = (p, r) => hdist(player.car ? player.car.pos : player.pos, p) < r;
  if (race.state === 'racing' || race.state === 'countdown' || player.dead) msg = '';
  else if (race.state === 'idle' && near(MARKER, 7)) msg = tap ? 'Tap <b>ACT</b> to set up a street race' : 'Press <b>R</b> to set up a street race';
  else if (!player.car && near(PORTAL_POS, 5)) msg = tap ? 'Tap <b>ACT</b> to use the portal' : 'Press <b>R</b> to use the portal';
  else if (player.car) msg = tap ? 'Tap <b>CAR</b> to get out' : '<b>W A S D</b> drive · <b>Space</b> handbrake · <b>E</b> get out';
  else if (nearestCar(4.5)) msg = tap ? 'Tap <b>CAR</b> to drive' : 'Press <b>E</b> to drive';
  if (txt.prompt !== msg) { txt.prompt = msg; $('#prompt').innerHTML = msg; $('#prompt').hidden = !msg; }
}
function toast(msg, kind = '') {
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg; $('#toasts').appendChild(t);
  while ($('#toasts').children.length > 4) $('#toasts').firstChild.remove();
  setTimeout(() => t.remove(), 3800);
}

// minimap
const mm = $('#minimap'), mg = mm.getContext('2d');
function drawMinimap() {
  if (mode !== 'play') return;
  const W = mm.width, s = W / 260, cx = W / 2;
  const px = player.pos.x, pz = player.pos.z, fy = Math.sin(cam.yaw), fz = Math.cos(cam.yaw);
  const P = (x, z) => { const rx = x - px, rz = z - pz; return [cx + (rx * -fz + rz * fy) * s, cx - (rx * fy + rz * fz) * s]; };
  mg.clearRect(0, 0, W, W);
  mg.save(); mg.beginPath(); mg.arc(cx, cx, cx - 2, 0, TAU); mg.clip();
  mg.fillStyle = '#0e0f22'; mg.fillRect(0, 0, W, W);
  mg.strokeStyle = '#3a3b55'; mg.lineWidth = 16 * s; mg.lineCap = 'butt';
  for (const r of ROADS) { mg.beginPath(); let a = P(r, -HALF), b = P(r, HALF); mg.moveTo(a[0], a[1]); mg.lineTo(b[0], b[1]); a = P(-HALF, r); b = P(HALF, r); mg.moveTo(a[0], a[1]); mg.lineTo(b[0], b[1]); mg.stroke(); }
  const dot = (x, z, r, c) => { const p = P(x, z); mg.fillStyle = c; mg.beginPath(); mg.arc(p[0], p[1], r, 0, TAU); mg.fill(); };
  if (race.state === 'idle') { dot(MARKER.x, MARKER.z, 7, '#ffcf5a'); dot(PORTAL_POS.x, PORTAL_POS.z, 5, '#8d6bff'); }
  else { const me = race.racers.find(r => r.me); if (me && me.cp < CP.length) { const p = CP[me.cp]; dot(p[0], p[1], 8, '#ff3d8b'); } }
  for (const c of cars) if (c !== player.car) dot(c.pos.x, c.pos.z, c.ai ? 5 : c.owned ? 6 : 3.5, c.ai ? '#ff9d2e' : c.owned ? '#3ee6d2' : '#7d7f99');
  for (const d of drones) if (d.deadT <= 0) dot(d.pos.x, d.pos.z, 4.5, lvlColor(d.level));
  mg.restore();
  mg.save(); mg.translate(cx, cx); const fa = player.car ? angDiff(cam.yaw, player.car.heading) : angDiff(cam.yaw, player.face); mg.rotate(-fa);
  mg.fillStyle = '#fff'; mg.beginPath(); mg.moveTo(0, -11); mg.lineTo(8, 9); mg.lineTo(0, 4); mg.lineTo(-8, 9); mg.closePath(); mg.fill(); mg.restore();
}

/* ---------- panels ---------- */
let onPanelClose = null;
function openPanel(html, onClose) {
  $('#panel').innerHTML = html; $('#shade').hidden = false; paused = true; onPanelClose = onClose || null;
  if (document.pointerLockElement) document.exitPointerLock();
  for (const k in keys) keys[k] = false;
  const f = $('#panel').querySelector('.btn.primary, .btn, .tab'); if (f && !isTouch) f.focus();
}
function closePanel() {
  if ($('#shade').hidden) return;
  $('#shade').hidden = true; paused = false; const cb = onPanelClose; onPanelClose = null; if (cb) cb();
}
$('#panel').addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b && b.dataset.a === 'close') closePanel(); });
$('#shade').addEventListener('pointerdown', e => { if (e.target === $('#shade') && race.state !== 'done') closePanel(); });
$('#bGarage').addEventListener('click', () => mode === 'play' && !paused && openGarage());
$('#bMenu').addEventListener('click', () => mode === 'play' && !paused && openMenu());

function openRaceSetup() {
  const stakes = [0, 25, 50, 100, 250];
  let stake = save.shards >= 50 ? 50 : 0, rmode = 'clean';
  const draw = () => {
    openPanel(`<h2>Street race</h2>
      <p>Four cars, one lap, 11 checkpoints through Neon Haven. Every racer puts in the same stake and the winner takes the pot. Prizes: 120 / 60 / 30 / 10 Shards.</p>
      <h3>Stake (Shards)</h3>
      <div class="row">${stakes.map(s => `<button class="btn ${s === stake ? 'on' : ''}" data-s="${s}" ${s > save.shards ? 'disabled' : ''}>${s || 'Free'}</button>`).join('')}</div>
      <h3>Mode</h3>
      <div class="row"><button class="btn ${rmode === 'clean' ? 'on' : ''}" data-m="clean">Clean race</button><button class="btn ${rmode === 'power' ? 'on' : ''}" data-m="power">Power race</button></div>
      <p>${rmode === 'power' ? 'Air gives you nitro, Ice freezes rivals near you. Rivals boost too.' : 'Pure driving. No powers for anyone.'}</p>
      <div class="note">Shards are earned in play and can't be bought or cashed out, so staking them isn't gambling. Real-money stakes need licences first; see the design document.</div>
      <div class="row"><button class="btn primary" id="rGo">Start${stake ? ` · stake ${stake}` : ''}</button><button class="btn" data-a="close">Cancel</button></div>`);
    $('#panel').querySelectorAll('[data-s]').forEach(b => b.onclick = () => { stake = +b.dataset.s; draw(); });
    $('#panel').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { rmode = b.dataset.m; draw(); });
    $('#rGo').onclick = () => { $('#shade').hidden = true; paused = false; onPanelClose = null; startRace(stake, rmode); };
  };

}
function openGarage(tab = 'powers') {
  const pips = (n, c) => `<span class="pips" style="color:${c}">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= n ? 'f' : ''}"></i>`).join('')}</span>`;
  const body = tab === 'powers' ? `<p>Power Points: <b>${save.pp}</b>. You get one each level. Each rank adds damage, range and duration, and lowers energy cost.</p>` +
    ELEMENTS.map(e => { const r = save.ranks[e.id], locked = save.level < e.unlock; return `<div class="prow" style="color:${e.css}"><svg viewBox="0 0 24 24">${ICONS[e.id]}</svg><div><div class="t" style="color:var(--text)">${e.el}: ${e.name}${pips(r, e.css)}</div><div class="s">${locked ? 'Unlocks at level ' + e.unlock : e.desc}</div></div><button class="btn" data-up="${e.id}" ${locked || r >= 5 || save.pp < 1 ? 'disabled' : ''}>${r >= 5 ? 'Max' : 'Rank up'}</button></div>`; }).join('')
    : tab === 'car' ? `<h3>Paint</h3><div class="swatches">${CAR_COLORS.map(c => `<button class="sw ${c === save.carColor ? 'on' : ''}" style="background:${c}" data-paint="${c}" aria-label="Paint ${c}"></button>`).join('')}</div>
      <h3>Engine</h3>` + ENGINES.slice(1).map((en, i) => { const tier = i + 1, own = save.engine >= tier; return `<div class="prow"><span class="t">T${tier}</span><div><div class="t">${en.name}</div><div class="s">Top speed ${Math.round(en.max * 3.6)} km/h</div></div><button class="btn" data-eng="${tier}" ${own || save.shards < en.price || tier !== save.engine + 1 ? 'disabled' : ''}>${own ? 'Owned' : en.price + ' Shards'}</button></div>`; }).join('') +
      `<p>Your car is the one with the teal underglow. It parks by the race marker east of the plaza.</p>`
    : `<p>Change your look any time. Your progress stays.</p><div class="row"><button class="btn primary" id="gAvatar">Edit avatar</button></div>`;
  openPanel(`<h2>Garage</h2><div class="tabs">${[['powers', 'Powers'], ['car', 'Car'], ['avatar', 'Avatar']].map(([k, l]) => `<button class="tab ${k === tab ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('')}</div>${body}<div class="row"><button class="btn" data-a="close">Close</button></div>`);
  const P = $('#panel');
  P.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => openGarage(b.dataset.tab));
  P.querySelectorAll('[data-up]').forEach(b => b.onclick = () => { if (save.pp < 1) return; save.pp--; save.ranks[b.dataset.up]++; persist(); renderElements(); openGarage('powers'); });
  P.querySelectorAll('[data-paint]').forEach(b => b.onclick = () => { save.carColor = b.dataset.paint; myCar.paint.color.set(save.carColor); persist(); openGarage('car'); });
  P.querySelectorAll('[data-eng]').forEach(b => b.onclick = () => { const t = +b.dataset.eng, en = ENGINES[t]; if (save.shards < en.price) return; save.shards -= en.price; save.engine = t; myCar.max = en.max; persist(); toast(`${en.name} engine fitted.`, 'gold'); openGarage('car'); });
  const ga = $('#gAvatar'); if (ga) ga.onclick = () => { $('#shade').hidden = true; paused = false; openCreator(); };
}
function openMenu() {
  const touchKeys = `<span><kbd>Left side</kbd></span><span>Move or steer (push to the edge to sprint)</span><span><kbd>Right side</kbd></span><span>Drag to look</span><span><kbd>POWER</kbd></span><span>Use the selected element (hold for Fire)</span><span><kbd>CAR</kbd> <kbd>ACT</kbd></span><span>Get in or out, start a race</span><span><kbd>JUMP</kbd></span><span>Jump, or handbrake in a car</span>`;
  const deskKeys = `<span><kbd>W A S D</kbd></span><span>Move or drive</span><span><kbd>Mouse</kbd></span><span>Look (click the game to lock the pointer)</span><span><kbd>Shift</kbd></span><span>Sprint</span><span><kbd>Space</kbd></span><span>Jump, or handbrake in a car</span><span><kbd>Click</kbd> <kbd>F</kbd></span><span>Use the selected element</span><span><kbd>1–5</kbd> <kbd>Wheel</kbd></span><span>Pick an element</span><span><kbd>E</kbd></span><span>Get in or out of a car</span><span><kbd>R</kbd></span><span>Start a race at the yellow marker</span><span><kbd>G</kbd></span><span>Garage: powers, car, avatar</span><span><kbd>Gamepad</kbd></span><span>Sticks, A jump, RT power / gas, Y car, X interact, LB/RB element</span>`;
  openPanel(`<h2>Paused</h2><div class="keys">${isTouch ? touchKeys : deskKeys}</div>
    <p>Fight rogue drones for XP and Shards. Drones above your level (red tags) pay up to 3× XP. Win street races to grow your Shards.</p>
    <div class="row"><button class="btn primary" data-a="close">Resume</button><button class="btn danger" id="mReset">Reset progress</button></div><div id="mConfirm"></div>`);
  $('#mReset').onclick = () => {
    $('#mConfirm').innerHTML = `<div class="note">This deletes your avatar, level and Shards on this device. <div class="row" style="margin-top:8px"><button class="btn danger" id="mYes">Delete progress</button><button class="btn" id="mNo">Keep it</button></div></div>`;
    $('#mNo').onclick = () => { $('#mConfirm').innerHTML = ''; };
    $('#mYes').onclick = () => { try { localStorage.removeItem(KEY); } catch (e) {} save = structuredClone(DEFAULT); closePanel(); location.reload(); };
  };
}

/* ---------- creator ---------- */
function openCreator() {
  mode = 'creator';
  $('#hud').hidden = true; $('#touch').hidden = true; $('#creator').hidden = false;
  player.car = null; player.pos.set(0, 0, 14);
  if (avatar) { avatar.g.visible = true; avatar.g.position.copy(player.pos); setAnim(avatar, 'idle', 0.2); }
  $('#cName').value = save.name; $('#cHeight').value = save.height; markBody();
}
function markBody() { $('#cBody').querySelectorAll('[data-body]').forEach(b => b.classList.toggle('on', b.dataset.body === save.body)); }
$('#cBody').addEventListener('click', e => { const b = e.target.closest('[data-body]'); if (!b || !avatar) return; save.body = b.dataset.body; markBody(); buildAvatar(); });
$('#cHeight').oninput = e => { save.height = +e.target.value; if (avatar) avatar.g.scale.setScalar(save.height); };
$('#cGo').onclick = () => {
  save.name = ($('#cName').value || '').trim().slice(0, 16) || 'Traveler';
  const first = !save.created; save.created = true; persist();
  $('#creator').hidden = true; $('#hud').hidden = false; $('#touch').hidden = !isTouch;
  mode = 'play'; cam.yaw = Math.PI; cam.pitch = 0.28;
  renderElements(); renderJobs();
  if (first) {
    toast(`Welcome to Neon Haven, ${save.name}.`, 'gold');
    setTimeout(() => toast('Drones circle the outer blocks. Use Fire on them to level up. Any car can be driven, even in traffic.'), 1200);
    setTimeout(() => toast('Your car is parked by the yellow race marker, east of the plaza.'), 2600);
  }
};

/* ---------- loop ---------- */
let last = performance.now(), saveT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (mode === 'play' && !paused) { update(dt); saveT += dt; if (saveT > 10) { saveT = 0; persist(); } }
  else if (mode === 'play') pollPad();
  if (!paused) updateEffects(dt);
  if (avatar && !paused) avatar.mixer.update(dt);
  if (!paused) for (const p of dancers) if (p.g.position.distanceTo(camera.position) < 120) p.mixer.update(dt);
  sun.target.position.copy(player.pos); sun.position.copy(player.pos).addScaledVector(SUN_DIR, 300);
  portal.children[1].material.opacity = 0.25 + Math.sin(now / 400) * 0.1;
  updateCamera(dt);
  sky.position.copy(camera.position);
  updateHUD();
  renderer.render(scene, camera);
  drawMinimap();
}
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play' && !paused && $('#shade').hidden) openMenu(); });

function start(data) {
  if (data && data.save && data.save.v === 1) save = data.save;
  myCar.paint.color.set(save.carColor); myCar.max = ENGINES[save.engine].max;
  player.hp = maxHp(); player.en = maxEn();
  loadModels().then(() => {
    buildAvatar(); spawnPeds(); spawnParty(); openCreator();
    $('#cGo').disabled = false; $('#cGo').textContent = 'Enter Neon Haven';
  }).catch(() => { $('#cGo').textContent = 'Characters could not load. Reload to try again.'; });
  for (const d of drones) setSpriteText(d.label, 'Lv ' + d.level, lvlColor(d.level));
  openCreator();
  requestAnimationFrame(t => { last = t; frame(t); });
}
window.claude?.hot?.snapshot?.(() => ({ save }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
