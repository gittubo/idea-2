<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{subject}}</title></head>
<body style="margin:0;background:#F4F1EA;font-family:Inter,Arial,sans-serif;color:#3A3A38;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding:24px 12px;">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:8px;">
      <tr><td style="padding:24px 32px 0;"><img src="{{logo_url}}" alt="Northpine Packs" width="160" style="display:block;"></td></tr>
      <tr><td style="padding:16px 32px 0;"><img src="{{hero_image_url}}" alt="{{hero_alt}}" width="536" style="display:block;width:100%;height:auto;border-radius:6px;"></td></tr>
      <tr><td style="padding:24px 32px;">
        <h1 style="font-family:Fraunces,Georgia,serif;color:#1F3D2B;font-size:28px;line-height:1.2;margin:0 0 16px;">{{headline}}</h1>
        <div style="font-size:16px;line-height:1.6;">{{body_html}}</div>
        <p style="margin:24px 0;"><a href="{{cta_url}}" style="background:#C8553D;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:6px;display:inline-block;font-weight:600;">{{cta_text}}</a></p>
        <p style="margin:0;">— The Northpine team</p>
      </td></tr>
      <!-- REQUIRED FOOTER: do not remove (CAN-SPAM). Replace the address with your real one. -->
      <tr><td style="padding:16px 32px 24px;font-size:12px;line-height:1.5;color:#777;border-top:1px solid #eee;">
        Northpine Packs · 123 Placeholder St, Suite 4 · Portland, OR 97201 · USA<br>
        You're getting this because you signed up at northpine.example.
        <a href="{{ unsubscribe_url }}" style="color:#6B8F5E;">Unsubscribe</a>
      </td></tr>
    </table>
  </td></tr></table>
</body>
</html>
