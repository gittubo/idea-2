# Plain static site: no build step. Netlify serves the site/ folder as-is,
# and turns /ai-system into ai-system.html automatically (Pretty URLs).
[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The preview has no privacy/terms pages, so send those links to Cindy's live ones.
# Netlify skips a redirect when a file exists at the path (no force = true),
# so this does nothing once the site runs alongside her real privacy.html/terms.html.
[[redirects]]
  from = "/privacy"
  to = "https://cindyzhu.com.au/privacy"
  status = 302

[[redirects]]
  from = "/terms"
  to = "https://cindyzhu.com.au/terms"
  status = 302

# The preview carries one sample guide; every other guide (and the Canva film page)
# lives on Cindy's site, so fall back to it. Not forced: the sample guide is still
# served from here, and on her own site these never fire because the files exist.
[[redirects]]
  from = "/guides/*"
  to = "https://cindyzhu.com.au/guides/:splat"
  status = 302

[[redirects]]
  from = "/canva-film"
  to = "https://cindyzhu.com.au/canva-film"
  status = 302
